[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-suite-automator"
version = "0.2.1"
description = "Semi-automated USB-IF CV Suite orchestration for Windows 11."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Ryan Oswalt" }
]
dependencies = [
  "comtypes==1.4.11",
  "phidget22==1.22.20250714",
  "pywin32==311; platform_system == 'Windows'",
  "pywinauto==0.6.9+usbif.1",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
usb-if = "cv_suite_automator.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.10.0",
  "pre-commit>=3.7.0",
  "pre-commit-hooks==5.0.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.2",
]

[tool.uv]
required-version = ">=0.12.9"
find-links = ["wheels"]
no-index = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cv_suite_automator*"]

[tool.setuptools.package-data]
cv_suite_automator = ["summary_template.json", "bin/*.exe"]

[tool.setuptools.data-files]
"share/man/man1" = ["docs/man/usb-if.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
src = ["src", "tools", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM", "PLR"]

[tool.ruff.lint.pylint]
max-statements = 30
max-branches = 10
max-locals = 12
max-nested-blocks = 4
max-args = 6
max-positional-args = 4
max-bool-expr = 4

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["Phidget22.*", "pywinauto.*", "win32con", "win32gui"]
ignore_missing_imports = true
