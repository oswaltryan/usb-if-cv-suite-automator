version = 1
revision = 3
requires-python = ">=3.12"

[[package]]
name = "colorama"
version = "0.4.6"
source = { registry = "wheels" }
wheels = [
    { path = "colorama-0.4.6-py2.py3-none-any.whl" },
]

[[package]]
name = "comtypes"
version = "1.4.11"
source = { registry = "wheels" }
wheels = [
    { path = "comtypes-1.4.11-py3-none-any.whl" },
]

[[package]]
name = "cv-suite-automator"
version = "0.2.1"
source = { editable = "." }
dependencies = [
    { name = "comtypes" },
    { name = "phidget22" },
    { name = "pillow" },
    { name = "pywin32", marker = "sys_platform == 'win32'" },
    { name = "pywinauto" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "comtypes", specifier = "==1.4.11" },
    { name = "phidget22", specifier = "==1.22.20250714" },
    { name = "pillow", specifier = ">=10.0" },
    { name = "pywin32", marker = "sys_platform == 'win32'", specifier = "==311" },
    { name = "pywinauto", specifier = "==0.6.9+usbif.1" },
]

[package.metadata.requires-dev]
dev = [{ name = "pytest", specifier = ">=8.0.0" }]

