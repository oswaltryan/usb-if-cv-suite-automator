name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.9"
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run unit tests
        run: uv run --locked pytest
